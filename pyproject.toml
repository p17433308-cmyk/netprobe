[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "netprobe"
version = "1.0.0"
description = "Who Watches the Watchmen? — Vulnerability hunter for network security tool protocol parsers"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "DFIR Research Lab"},
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "jinja2>=3.1",
    "tree-sitter>=0.21",
    "tree-sitter-c>=0.21",
    "scapy>=2.5",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
all = ["netprobe[ai,dev]"]

[project.scripts]
netprobe = "netprobe.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
